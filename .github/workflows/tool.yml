name: Tool checks
on:
  workflow_call:
    inputs:
      tool:
        required: true
        type: string
      language:
        required: true
        type: string

permissions:
  contents: read

jobs:
  ts:
    name: TypeScript tool checks (${{ inputs.tool }})
    if: inputs.language == 'ts'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TOOL: ${{ inputs.tool }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            services/${{ inputs.tool }}/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Manifest and template drift
        run: |
          scripts/tool-ci manifest "$TOOL"
          if [[ "$TOOL" != _template ]]; then scripts/new-tool --check "$TOOL"; fi
      - name: Install, lint and check module boundaries
        run: |
          cd "services/$TOOL"
          npm ci --no-audit --no-fund
          npm run lint
          npm run typecheck
          npm run check:imports
      - name: Mock tests with coverage and no outbound network
        run: |
          cd "services/$TOOL"
          ../../scripts/offline-tool npm run test:coverage
      - name: Request validation budget
        if: hashFiles(format('services/{0}/scripts/benchmark-validation.mjs', inputs.tool)) != ''
        working-directory: services/${{ inputs.tool }}
        run: |
          ../../scripts/offline-tool npm run build
          ../../scripts/offline-tool node scripts/benchmark-validation.mjs

  python:
    name: Python tool checks (${{ inputs.tool }})
    # Enable and install the pinned Python/uv toolchain in the Python bring-up.
    if: inputs.language == 'python' && false
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - working-directory: services/${{ inputs.tool }}
        env:
          LLM_MODE: mock
        run: |
          uv sync --frozen
          uv run ruff check .
          uv run mypy --strict .
          uv run lint-imports
          uv run pytest --cov

  go:
    name: Go tool checks (${{ inputs.tool }})
    # Enable and install the pinned Go toolchain in the Go bring-up.
    if: inputs.language == 'go' && false
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - working-directory: services/${{ inputs.tool }}
        env:
          LLM_MODE: mock
        run: |
          go mod verify
          golangci-lint run
          go test -cover ./...
