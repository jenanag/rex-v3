openapi: 3.1.0
info:
  title: REx shared contract components
  version: 1.0.0
  description: |
    Single source of truth for every component that more than one REx service
    contract uses: errors, pagination, auth schemes, IDs, timestamps, async job
    fields, health endpoints and shared enums.

    Used by the orchestrator spec and by every stateless tool spec.

    Rules (see docs/dry-rule.md):
    - Service specs `$ref` these components. Copying any of them is a CI failure.
    - Only add a component here when two or more specs need the same contract
      shape. Resources stay in the owning spec (orchestrator resources in the
      orchestrator spec, tool inputs/outputs in the tool's spec); other contracts
      `$ref` them there.
    - Changes here are contract changes for every service: additive only within v1.
# No paths: this document only holds components.
components:
  securitySchemes:
    bearerToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        REx access token for users and exchanged API keys, issued by the
        orchestrator's identity module. See ADR 0014.
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: |
        Client API key (`rex_live_...` / `rex_test_...`). Only the gateway accepts
        it; the gateway exchanges it for a short-lived access token before
        forwarding. Services never see raw API keys.
    serviceToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Service token (`typ: service`) issued by the orchestrator's identity module
        to the gateway and workers. The only credential tool services accept; they
        verify it offline with the published public keys. See ADR 0014.

  parameters:
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor from `page.nextCursor` of the previous response.
      schema:
        type: string
        maxLength: 512
    Limit:
      name: limit
      in: query
      required: false
      description: Page size.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    ProjectIdQuery:
      name: projectId
      in: query
      required: true
      description: Project the list is scoped to.
      schema:
        $ref: '#/components/schemas/ProjectId'
    From:
      name: from
      in: query
      required: false
      description: Inclusive start of the time range (RFC 3339, UTC). Defaults to `to` minus 30 days.
      schema:
        $ref: '#/components/schemas/Timestamp'
    To:
      name: to
      in: query
      required: false
      description: Exclusive end of the time range (RFC 3339, UTC). Defaults to now. Max range 366 days.
      schema:
        $ref: '#/components/schemas/Timestamp'
    EngineQuery:
      name: engine
      in: query
      required: false
      description: Filter by answer engine.
      schema:
        $ref: '#/components/schemas/EngineId'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Client-generated unique key (UUID or ULID, max 255 chars). Replays within
        24 hours return the stored response. See docs/conventions.md#idempotency.
      schema:
        type: string
        minLength: 1
        maxLength: 255

  headers:
    RequestId:
      description: Request ID (echoed from the request or generated by the gateway).
      schema:
        type: string
    RetryAfter:
      description: Seconds to wait before retrying.
      schema:
        type: integer
        minimum: 0
    RexCache:
      description: |
        Set by the gateway on proxied public tool calls: how the response was served
        by the cache-first layer (ADR 0016). Tools never set it.
      schema:
        $ref: '#/components/schemas/CacheOutcome'
    RexCachedAt:
      description: Set by the gateway with `X-Rex-Cache` when the response came from the cache; when the cached value was produced.
      schema:
        $ref: '#/components/schemas/Timestamp'
    Location:
      description: URL of the created or accepted resource.
      schema:
        type: string
        format: uri-reference

  responses:
    NoContent:
      description: Success, no body.
    BadRequest:
      description: The request is malformed or fails schema validation.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Missing or invalid credentials.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Authenticated but not allowed (role, API key access or plan limit).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: The resource does not exist or is not visible to the caller's org.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: The request conflicts with the resource's current state, or an idempotent request with the same key is still in flight.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnprocessableContent:
      description: Well-formed but violates a business rule, or an Idempotency-Key was reused with a different body.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: Rate limit or quota exceeded.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalError:
      description: Unexpected server error.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ServiceUnavailable:
      description: A dependency is unavailable; retry later.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Health:
      description: Health status.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Health'

  pathItems:
    Healthz:
      get:
        operationId: getLiveness
        summary: Liveness probe
        description: Returns 200 while the process is running. Never checks dependencies.
        x-internal: true
        tags: [Health]
        security: []
        responses:
          '200':
            $ref: '#/components/responses/Health'
          '503':
            $ref: '#/components/responses/ServiceUnavailable'
    Readyz:
      get:
        operationId: getReadiness
        summary: Readiness probe
        description: 'Returns 200 when the service can serve traffic: required config loaded and its own dependencies reachable (orchestrator: Postgres and RabbitMQ; workers: RabbitMQ; gateway: Redis; tools: signing keys loaded).'
        x-internal: true
        tags: [Health]
        security: []
        responses:
          '200':
            $ref: '#/components/responses/Health'
          '503':
            $ref: '#/components/responses/ServiceUnavailable'

  schemas:
    # ---------- Errors (RFC 9457) ----------
    Problem:
      type: object
      description: RFC 9457 problem details, with REx extension members.
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri
          description: 'URI identifying the problem type: `{PROBLEM_BASE_URI}/{code}`. PROBLEM_BASE_URI is a deployment setting; the product domain is deferred, so it is a placeholder until then (docs/roadmap.md#deferred-decisions).'
        title:
          type: string
          description: Short, human-readable summary of the problem type.
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
          description: Explanation specific to this occurrence.
        instance:
          type: string
          format: uri-reference
          description: Request path of this occurrence.
        code:
          type: string
          pattern: '^[a-z][a-z0-9_]*$'
          description: Stable machine-readable error code (snake_case), e.g. `validation_failed`.
        traceId:
          type: string
          description: W3C trace ID for support and log correlation.
        errors:
          type: array
          description: Field-level errors; present for `validation_failed`.
          items:
            $ref: '#/components/schemas/FieldError'
    FieldError:
      type: object
      required: [pointer, detail]
      properties:
        pointer:
          type: string
          description: JSON Pointer (RFC 6901) into the request body, or `#/query/<name>` / `#/header/<name>`.
        detail:
          type: string

    # ---------- Pagination ----------
    PageInfo:
      type: object
      required: [nextCursor, hasMore]
      properties:
        nextCursor:
          type: [string, 'null']
          description: Pass as `cursor` to get the next page; null on the last page.
        hasMore:
          type: boolean
    Page:
      type: object
      description: |
        Base of every list response. Lists are written as
        `allOf: [{$ref: Page}, {properties: {data: {items: {$ref: <Item>}}}}]`.
      required: [data, page]
      properties:
        data:
          type: array
          items: {}
        page:
          $ref: '#/components/schemas/PageInfo'

    # ---------- Primitives ----------
    LanguageTag:
      type: string
      description: |
        BCP 47 language tag, lowercase language subtag first, e.g. `en`, `en-US`,
        `pt-BR`. Matching against a supported list uses the primary language subtag
        (`en-US` matches `en`).
      pattern: '^[a-z]{2,3}(-[A-Za-z0-9]{2,8})*$'
      maxLength: 35
    IsoDuration:
      type: string
      description: ISO 8601 duration in days, hours, minutes and seconds, e.g. `PT5M`, `P1D`, `P30D`.
      pattern: '^P(?=\d|T\d)(\d+D)?(T(?=\d)(\d+H)?(\d+M)?(\d+S)?)?$'
    Timestamp:
      type: string
      format: date-time
      description: RFC 3339 timestamp in UTC with millisecond precision, e.g. `2026-11-22T01:02:03.456Z`.
    Url:
      type: string
      format: uri
      maxLength: 2048
      pattern: '^https?://'
    Domain:
      type: string
      format: hostname
      maxLength: 253
      description: Lower-case host name without scheme or `www.`, e.g. `example.com`.
    Locale:
      type: string
      pattern: '^[a-z]{2,3}(-[A-Z]{2})?$'
      description: BCP 47 language tag, e.g. `en-US`.
      default: en-US
    CountryCode:
      type: string
      pattern: '^[A-Z]{2}$'
      description: ISO 3166-1 alpha-2 country code, e.g. `US`.
      default: US

    # ---------- Shared enums ----------
    EngineId:
      type: string
      description: |
        AI answer engine. Consumers must tolerate unknown values (tolerant reader),
        so adding an engine is a non-breaking change; it also adds a per-engine
        answer-capture queue (bus/topology.yaml expands `{engine}` from this enum).
        The engine-to-model mapping is owned by engine-query (`GET /v1/engines`).
      enum: [chatgpt, claude, gemini, perplexity, grok]
    JobStatus:
      type: string
      description: Lifecycle of any asynchronous job resource.
      enum: [queued, running, succeeded, failed, canceled]
    Sentiment:
      type: string
      enum: [positive, neutral, negative]
    ValidationIssue:
      type: object
      description: One finding from a validator (schema markup, llms.txt, ...).
      required: [severity, message]
      properties:
        severity:
          type: string
          enum: [error, warning, info]
        code:
          type: string
          pattern: '^[a-z][a-z0-9_]*$'
        message:
          type: string
        pointer:
          type: string
          description: JSON Pointer or `line:<n>` locating the issue in the validated input.
    ValidationResult:
      type: object
      required: [valid, issues]
      properties:
        valid:
          type: boolean
          description: True when there are no `error` issues.
        issues:
          type: array
          items:
            $ref: '#/components/schemas/ValidationIssue'

    AiCrawler:
      type: object
      description: |
        One known AI crawler. The list itself is data in
        packages/contracts/data/ai-crawlers.yaml (validated against this schema),
        used by content-auditor and ai-traffic-analyzer.
      required: [id, robotsToken, operator, purpose]
      properties:
        id:
          type: string
          pattern: '^[a-z][a-z0-9_]*$'
        robotsToken:
          type: string
          description: Token matched against robots.txt `User-agent` lines.
        userAgentPattern:
          type: [string, 'null']
          description: Case-insensitive substring found in request User-Agent headers; null for robots-only tokens (e.g. Google-Extended).
        operator:
          type: string
        purpose:
          type: string
          description: training = model training crawl; search = index for AI search answers; user_fetch = fetched live because a user asked.
          enum: [training, search, user_fetch]

    BrandKind:
      type: string
      description: Each project has exactly one `primary` brand; all others are `competitor`.
      enum: [primary, competitor]
    TrackedBrand:
      type: object
      description: |
        A brand as passed to stateless tools (answer-analysis, citation-extractor).
        `key` is opaque to tools and echoed back; the orchestrator uses brand IDs.
      required: [key, kind, name, aliases, domains]
      properties:
        key:
          type: string
          minLength: 1
          maxLength: 64
        kind:
          $ref: '#/components/schemas/BrandKind'
        name:
          type: string
          minLength: 1
          maxLength: 100
        aliases:
          type: array
          maxItems: 20
          items:
            type: string
            minLength: 1
            maxLength: 100
        domains:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/Domain'
    AnswerSource:
      type: object
      description: A source URL an engine reported for its answer (citations, grounding or annotations).
      required: [url, position]
      properties:
        url:
          $ref: '#/components/schemas/Url'
        title:
          type: [string, 'null']
        position:
          type: integer
          minimum: 1
          description: 1-based order in the engine's source list.
    LlmUsage:
      type: object
      description: One LLM call made while serving a request. Tools report it; the orchestrator meters it.
      required: [provider, model, operation, inputTokens, outputTokens, costMicrosUsd]
      properties:
        provider:
          type: string
          examples: [openai]
        model:
          type: string
        operation:
          type: string
          description: What the call was for, e.g. `answer_prompt`, `classify_sentiment`, `summarize_page`.
        inputTokens:
          type: integer
          minimum: 0
        outputTokens:
          type: integer
          minimum: 0
        costMicrosUsd:
          type: integer
          minimum: 0
          description: Cost in millionths of a US dollar from the provider price table at call time.
    LlmUsageList:
      type: array
      description: Every LLM call made for this response; empty when none.
      items:
        $ref: '#/components/schemas/LlmUsage'
    # ---------- Page content (ADR 0021) ----------
    ExtractedContent:
      type: object
      description: |
        A page's main content as normalized plain text and Markdown, extracted by
        the platform before the call (ADR 0021); tools receive it and never extract
        it themselves.
      required: [text, markdown]
      properties:
        text:
          type: string
          maxLength: 1000000
          description: Normalized plain text of the main content.
        markdown:
          type: string
          maxLength: 1000000
          description: Normalized Markdown of the main content.
    FetchedPage:
      type: object
      description: |
        Raw HTTP response of one page, for tools that must read what main-content
        extraction removes (markup, meta tags, JSON-LD, headers). Fetched by the
        platform before the call (ADR 0021); tools never fetch it.
      required: [finalUrl, status, headers, html]
      properties:
        finalUrl:
          $ref: '#/components/schemas/Url'
        status:
          type: integer
          minimum: 100
          maximum: 599
        headers:
          type: object
          description: Response headers, names lowercased; repeated headers joined with `, `.
          maxProperties: 200
          additionalProperties:
            type: string
            maxLength: 8192
        html:
          type: string
          maxLength: 2000000
          description: Response body as served (server-rendered HTML, no JavaScript executed); truncated at the cap.
    PageMetadata:
      type: object
      description: Page-level metadata read from the HTML head by the content-extractor service (ADR 0021); tools never extract it themselves.
      required: [title, description, language, canonicalUrl]
      properties:
        title:
          type: [string, 'null']
          maxLength: 1000
          description: '`<title>`, else `og:title`; null when neither is present.'
        description:
          type: [string, 'null']
          maxLength: 5000
          description: Meta description, else `og:description`; null when neither is present.
        language:
          description: '`<html lang>` normalized to a language tag; null when absent or invalid.'
          oneOf:
            - $ref: '#/components/schemas/LanguageTag'
            - type: 'null'
        canonicalUrl:
          description: '`<link rel="canonical">` resolved against the page URL; null when absent.'
          oneOf:
            - $ref: '#/components/schemas/Url'
            - type: 'null'
    FetchedFile:
      type: object
      description: One fetched text file, e.g. a site's robots.txt, passed to a tool verbatim.
      required: [url, status, content]
      properties:
        url:
          $ref: '#/components/schemas/Url'
        status:
          type: [integer, 'null']
          description: HTTP status; null on network error or timeout.
        content:
          type: [string, 'null']
          maxLength: 500000
          description: Body when `status` is 2xx, else null.
    LlmsTxtValidation:
      description: |
        Result of validating an llms.txt. Produced by llms-txt-generator and accepted
        as input by content-auditor (a worker chains the two).
      allOf:
        - $ref: '#/components/schemas/ValidationResult'
        - type: object
          required: [found, url, httpStatus]
          properties:
            found:
              type: boolean
              description: False when there is no file (status not 2xx or no content); then `valid` is false.
            url:
              description: URL of the file; null when the content was given inline.
              oneOf:
                - $ref: '#/components/schemas/Url'
                - type: 'null'
            httpStatus:
              type: [integer, 'null']

    # ---------- Async jobs (orchestrator resources) ----------
    JobFields:
      type: object
      description: Fields shared by every async job resource (composed with allOf).
      required: [status, createdAt]
      properties:
        status:
          $ref: '#/components/schemas/JobStatus'
        error:
          description: Set when `status` is `failed`.
          oneOf:
            - $ref: '#/components/schemas/Problem'
            - type: 'null'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        startedAt:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        completedAt:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'

    # ---------- Resource metadata ----------
    CacheMode:
      type: string
      description: |
        How the cache-first layer treats one tool call (ADR 0016; policy in
        packages/contracts/cache/policy.yaml). `use`: read, on a miss call the tool
        and store. `refresh`: skip the read, call, store. `bypass`: skip read and
        store.
      enum: [use, refresh, bypass]
      default: use
    CacheOutcome:
      type: string
      description: '`hit` served from the cache; `miss` not found, tool called and result stored; `refresh` and `bypass` as in CacheMode; `uncacheable` tool called, result not stored (error, partial result or policy).'
      enum: [hit, miss, refresh, bypass, uncacheable]
    CacheScope:
      type: string
      description: |
        Who shares a cache entry (policy.yaml `scopes`). `shared`: every customer
        with the same input (default). `tenant`: only the same organization.
      enum: [shared, tenant]
    CacheOverride:
      type: object
      description: |
        A per-customer override of one operation's cache settings. How overrides
        combine with environment settings and policy.yaml defaults, and which
        changes are allowed, is defined only in policy.yaml `resolution`.
      minProperties: 1
      unevaluatedProperties: false
      not:
        description: ttl and window are mutually exclusive.
        required: [ttl, window]
        properties:
          ttl: true
          window: true
      properties:
        scope:
          $ref: '#/components/schemas/CacheScope'
        ttl:
          $ref: '#/components/schemas/IsoDuration'
        window:
          $ref: '#/components/schemas/IsoDuration'
    CacheDirective:
      type: object
      description: Cache instructions carried by a job message for every tool call of its flow.
      unevaluatedProperties: false
      properties:
        overrides:
          type: object
          description: |
            The organization's per-customer cache overrides, keyed by
            `<tool>.<operationId>` (including `content-extractor.extractContent`)
            or `*` (every operation). Filled by the
            orchestrator from the org's settings; absent when the org has none.
          maxProperties: 50
          propertyNames:
            pattern: '^(\*|[a-z][a-z0-9-]*\.[a-z][A-Za-z0-9]*)$'
          additionalProperties:
            $ref: '#/components/schemas/CacheOverride'
        mode:
          $ref: '#/components/schemas/CacheMode'
        variant:
          type: integer
          minimum: 0
          maximum: 99
          default: 0
          description: Part of the cache key. Answer capture sets it to the sample index so samples of one prompt stay independent.
    ToolCallCache:
      type: object
      description: Cache metadata for one cached call made by a worker or the gateway (a tool operation, or a worker's call to an external service such as `content-extractor.extractContent`).
      required: [tool, operationId, outcome, cachedAt]
      properties:
        tool:
          type: string
          pattern: '^[a-z][a-z0-9-]*$'
        operationId:
          type: string
        outcome:
          $ref: '#/components/schemas/CacheOutcome'
        cachedAt:
          description: When the served value was produced by the tool; null unless `outcome` is `hit`.
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        key:
          type: string
          minLength: 1
          maxLength: 300
          description: The entry's cache key (policy.yaml `key`), set by workers so a later job can read the value back (ADR 0023); also its key in the data-aggregator when archived. Absent on gateway calls.
    ToolCallCacheList:
      type: array
      description: One entry per tool call, in call order. LLM usage of `hit` calls was paid when the value was produced and is not metered again.
      items:
        $ref: '#/components/schemas/ToolCallCache'
    ResourceTimestamps:
      type: object
      required: [createdAt, updatedAt]
      properties:
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'

    # ---------- Health ----------
    Health:
      type: object
      required: [status, service, version]
      properties:
        status:
          type: string
          enum: [ok, degraded, down]
        service:
          type: string
        version:
          type: string
        checks:
          type: object
          additionalProperties:
            type: string
            enum: [ok, down]

    # ---------- IDs: prefixed ULIDs. This list IS the prefix registry. ----------
    OrgId:
      type: string
      pattern: '^org_[0-9A-HJKMNP-TV-Z]{26}$'
      examples: [org_01JD3Z8XQK5V7N2M4P6R8T0W2Y]
    UserId:
      type: string
      pattern: '^usr_[0-9A-HJKMNP-TV-Z]{26}$'
    ProjectId:
      type: string
      pattern: '^prj_[0-9A-HJKMNP-TV-Z]{26}$'
    BrandId:
      type: string
      pattern: '^brd_[0-9A-HJKMNP-TV-Z]{26}$'
    ApiKeyId:
      type: string
      pattern: '^key_[0-9A-HJKMNP-TV-Z]{26}$'
    ScheduleId:
      type: string
      pattern: '^sch_[0-9A-HJKMNP-TV-Z]{26}$'
    PromptId:
      type: string
      pattern: '^prm_[0-9A-HJKMNP-TV-Z]{26}$'
    PromptRunId:
      type: string
      pattern: '^run_[0-9A-HJKMNP-TV-Z]{26}$'
    AnswerId:
      type: string
      pattern: '^ans_[0-9A-HJKMNP-TV-Z]{26}$'
    MentionId:
      type: string
      pattern: '^men_[0-9A-HJKMNP-TV-Z]{26}$'
    CitationId:
      type: string
      pattern: '^cit_[0-9A-HJKMNP-TV-Z]{26}$'
    AuditId:
      type: string
      pattern: '^aud_[0-9A-HJKMNP-TV-Z]{26}$'
    LlmsTxtId:
      type: string
      pattern: '^llt_[0-9A-HJKMNP-TV-Z]{26}$'
    EventId:
      type: string
      pattern: '^evt_[0-9A-HJKMNP-TV-Z]{26}$'
