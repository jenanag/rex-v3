openapi: 3.1.0
info:
  title: REx engine-query tool
  version: 2.2.0
  description: |
    Stateless tool: asks one AI answer engine one prompt and returns the normalized
    answer (Markdown text + engine-reported sources) and the LLM usage. No database,
    no queues, no bus, no calls to other tools. Called by workers.
    Service doc: docs/services/engine-query.md
    No authentication in the tool: only workers and the gateway can reach it (network
    policy), and the gateway exposes only `x-rex-public` operations (ADR 0014).
x-rex-service:
  name: engine-query
  kind: tool
security: []   # no auth inside tools: enforced in front of them (ADR 0014, ADR 0018)
tags:
  - name: Engines
  - name: Health
paths:
  /healthz:
    $ref: '../common.yaml#/components/pathItems/Healthz'
  /readyz:
    $ref: '../common.yaml#/components/pathItems/Readyz'
  /v1/engines:
    get:
      operationId: listEngines
      x-rex-limits: {llm: none, outboundFetch: none}
      summary: Engines this deployment can query and their default and allowed models
      tags: [Engines]
      responses:
        '200':
          description: Configured engines (small list; not paginated). ChatGPT supports web search. Gemini is text-only.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Engine'
        default:
          $ref: '../common.yaml#/components/responses/InternalError'
  /v1/engine-answers:
    post:
      operationId: queryEngine
      x-rex-limits: {maxDuration: PT120S, llm: required, llmCallTimeout: PT110S, outboundFetch: none}
      summary: Ask one engine one prompt (one sample) and return its answer
      description: |
        Accepts ChatGPT and Gemini. An unavailable engine returns 422 unsupported_engine
        before any provider call. Omit model to use the engine's deployment default.
        An exact, schema-valid model ID outside the selected engine's allowlist returns
        422 unsupported_model identifying /model before any provider call.
        ChatGPT defaults to required hosted search; Gemini
        defaults to text-only generation. Explicit false selects text-only generation.
        Gemini with explicit true returns 422 unsupported_web_search identifying
        /webSearch before any provider call.
        The original prompt is sent verbatim. Locale is an answer-language hint.
        Country is an approximate search location for grounded ChatGPT and a regional
        relevance hint for text-only generation.
        Grounded ChatGPT preserves Markdown and clickable citation locations. Sources
        are unique, usable HTTP(S) citation annotations in first-citation order.
        A completed, metered search can have no usable sources. Text-only answers return
        sources: [] and incur zero search fees. Usage reports one answer_prompt item.
        Provider failures, refusals, incomplete or unusable answers, missing required search
        evidence, unexpected model or pricing tier, and missing or inconsistent metering
        return 503 provider_unavailable. A valid upstream Retry-After is returned as
        non-negative integer seconds.
      tags: [Engines]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EngineQuery'
      responses:
        '200':
          description: The engine's answer and the LLM usage.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EngineAnswerResult'
        '400':
          $ref: '../common.yaml#/components/responses/BadRequest'
        '422':
          $ref: '../common.yaml#/components/responses/UnprocessableContent'
        '503':
          $ref: '../common.yaml#/components/responses/ServiceUnavailable'
        default:
          $ref: '../common.yaml#/components/responses/InternalError'
components:
  schemas:
    Engine:
      type: object
      required: [id, displayName, provider, model, allowedModels, webSearch, enabled]
      properties:
        id:
          $ref: '../common.yaml#/components/schemas/EngineId'
        displayName:
          type: string
          examples: [ChatGPT]
        provider:
          type: string
          description: 'API vendor, e.g. `openai`, `anthropic`, `google`, `perplexity`, `xai`.'
        model:
          type: string
          description: Default model ID for this engine.
        allowedModels:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            minLength: 1
          description: Exact model IDs this deployment accepts for the engine, including its default.
        webSearch:
          type: boolean
          description: True if this deployment can use hosted search when requested.
        enabled:
          type: boolean
    EngineQuery:
      type: object
      unevaluatedProperties: false
      required: [engine, prompt]
      properties:
        engine:
          $ref: '../common.yaml#/components/schemas/EngineId'
        model:
          type: string
          minLength: 1
          description: Exact model ID from the selected engine's allowlist. Omission uses the engine's default.
        prompt:
          type: string
          minLength: 3
          maxLength: 2000
        locale:
          $ref: '../common.yaml#/components/schemas/Locale'
          default: en-US
        country:
          $ref: '../common.yaml#/components/schemas/CountryCode'
          default: US
        webSearch:
          type: boolean
          description: Require completed hosted search when true. Omission defaults to true for ChatGPT and false for Gemini.
    EngineAnswer:
      type: object
      description: A normalized engine answer. The orchestrator stores it as part of its Answer resource.
      required: [engine, model, text, sources, latencyMs]
      properties:
        engine:
          $ref: '../common.yaml#/components/schemas/EngineId'
        model:
          type: string
        text:
          type: string
          description: Answer text as Markdown, normalized across engines.
        sources:
          type: array
          items:
            $ref: '../common.yaml#/components/schemas/AnswerSource'
        latencyMs:
          type: integer
          minimum: 0
    EngineAnswerResult:
      type: object
      required: [answer, usage]
      properties:
        answer:
          $ref: '#/components/schemas/EngineAnswer'
        usage:
          $ref: '../common.yaml#/components/schemas/LlmUsageList'
