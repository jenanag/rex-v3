openapi: 3.1.0
info:
  title: REx citation-extractor tool
  version: 1.0.0
  description: |
    Stateless tool: extracts cited URLs from one answer (engine-reported sources and
    inline links), normalizes them, and classifies each as own, competitor or
    third-party using the brand domains passed in the request. Deterministic, no
    LLM, no network. Domain aggregates are computed by the orchestrator.
    No database, no queues, no bus, no calls to other tools.
    Service doc: docs/services/citation-extractor.md
    No authentication in the tool: only workers and the gateway can reach it (network
    policy), and the gateway exposes only `x-rex-public` operations (ADR 0014).
x-rex-service:
  name: citation-extractor
  kind: tool
security: []   # no auth inside tools: enforced in front of them (ADR 0014, ADR 0018)
tags:
  - name: Citations
  - name: Health
paths:
  /healthz:
    $ref: '../common.yaml#/components/pathItems/Healthz'
  /readyz:
    $ref: '../common.yaml#/components/pathItems/Readyz'
  /v1/citation-extractions:
    post:
      operationId: extractCitations
      x-rex-limits: {llm: none, outboundFetch: none}
      summary: Extract and classify the citations of one answer
      tags: [Citations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CitationExtractionRequest'
      responses:
        '200':
          description: Citations in order (engine sources first, then inline links), deduplicated by URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CitationExtraction'
        '400':
          $ref: '../common.yaml#/components/responses/BadRequest'
        default:
          $ref: '../common.yaml#/components/responses/InternalError'
components:
  schemas:
    CitationExtractionRequest:
      type: object
      unevaluatedProperties: false
      required: [markdown, sources, brands]
      properties:
        markdown:
          type: string
          maxLength: 200000
          description: |
            The answer as Markdown, exactly as engine-query returned it (its normalized
            answer text); inline links are read from it. The tool fetches nothing: it
            never opens cited pages (page content, when needed, comes from the
            platform's content extraction, ADR 0021).
        sources:
          type: array
          items:
            $ref: '../common.yaml#/components/schemas/AnswerSource'
        brands:
          type: array
          maxItems: 50
          items:
            $ref: '../common.yaml#/components/schemas/TrackedBrand'
    Ownership:
      type: string
      description: own = a domain of the primary brand; competitor = a competitor's domain; third_party = anything else.
      enum: [own, competitor, third_party]
    CitationSourceType:
      type: string
      description: engine_source = listed by the engine as a source; inline_link = a link inside the answer text.
      enum: [engine_source, inline_link]
    CitationDetail:
      type: object
      description: One cited URL. The orchestrator's Citation resource reuses it.
      required: [url, domain, title, position, sourceType, ownership]
      properties:
        url:
          $ref: '../common.yaml#/components/schemas/Url'
        domain:
          $ref: '../common.yaml#/components/schemas/Domain'
        title:
          type: [string, 'null']
        position:
          type: integer
          minimum: 1
        sourceType:
          $ref: '#/components/schemas/CitationSourceType'
        ownership:
          $ref: '#/components/schemas/Ownership'
    CitationExtraction:
      type: object
      required: [citations]
      properties:
        citations:
          type: array
          items:
            allOf:
              - type: object
                required: [brandKey]
                properties:
                  brandKey:
                    type: [string, 'null']
                    description: '`key` of the owning TrackedBrand when `ownership` is own or competitor.'
              - $ref: '#/components/schemas/CitationDetail'
