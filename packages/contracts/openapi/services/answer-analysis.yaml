openapi: 3.1.0
info:
  title: REx answer-analysis tool
  version: 2.2.0
  description: |
    Stateless tool: finds tracked brands in one answer text and returns, per
    mentioned brand, its position, occurrences, a snippet and sentiment. Brands are
    passed in the request. Aggregate metrics (mention rate, share of voice) are
    computed by the orchestrator (docs/glossary.md).

    Deterministic first (ADR 0017): mention detection and position are always
    deterministic (name and alias matching). Sentiment can come from several
    analyzers in one call, deterministic (lexicon or rule based, no LLM) and LLM
    based (any listed provider and model), returned side by side with an agreement
    summary so they can be compared. The `primary` analyzer feeds `sentiment` and
    `sentimentScore`, which the metrics use.

    Languages: requests and responses carry a BCP 47 language tag. Deterministic
    analyzers use a per-language lexicon registry (English only today); what is
    supported is published by `listAnalyzers`. Unsupported languages fall back or
    fail as the caller chooses (`onUnsupportedLanguage`).
    No database, no queues, no bus, no calls to other tools.
    Service doc: docs/services/answer-analysis.md
    No authentication in the tool: only workers and the gateway can reach it (network
    policy), and the gateway exposes only `x-rex-public` operations (ADR 0014).
x-rex-service:
  name: answer-analysis
  kind: tool
security: []   # no auth inside tools: enforced in front of them (ADR 0014, ADR 0018)
tags:
  - name: Analysis
  - name: Health
paths:
  /healthz:
    $ref: '../common.yaml#/components/pathItems/Healthz'
  /readyz:
    $ref: '../common.yaml#/components/pathItems/Readyz'
  /v1/analyzers:
    get:
      operationId: listAnalyzers
      x-rex-limits: {llm: none, outboundFetch: none}
      summary: List the sentiment analyzers this deployment offers
      tags: [Analysis]
      responses:
        '200':
          description: |
            Available analyzers, deterministic ones first. Deployments advertise
            enabled LLM analyzers in catalog order: `llm:openai/gpt-6-luna` and
            `llm:google/gemini-2.5-flash-lite`. Both have kind `llm` and
            language support `["*"]`, including undetermined language.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Analyzer'
        default:
          $ref: '../common.yaml#/components/responses/InternalError'
  /v1/answer-analyses:
    post:
      operationId: analyzeAnswer
      x-rex-limits: {llm: optional, llmCallTimeout: PT60S, outboundFetch: none, notes: 'LLM only for llm: analyzers; each adds one batched call'}
      summary: Detect brand mentions and position, and classify sentiment with one or more analyzers
      description: |
        Synchronous. Results follow request order and use the same deterministic
        brand mentions. Omitted `sentiment` defaults to `det:lexicon`; an explicit
        empty `analyzers` list disables sentiment but still resolves the language.
        Select an advertised LLM analyzer to run one batched call for the
        mentioned brands. Selecting both Luna and Gemini runs the batches
        concurrently with independent deadlines. Usage items follow request
        order. If no brands are mentioned the tool makes no provider call and
        returns empty mentions and usage.

        A failed secondary LLM analyzer is reported as `failed` with null per-brand
        scores and labels, excluded from agreement. HTTP 200 includes any valid
        usage reported by the provider, including for unusable completions. A failed
        effective primary returns the shared 503 `provider_unavailable` Problem
        with a valid upstream Retry-After when available. Failure includes
        a timeout, refusal, incomplete or invalid output, invalid usage, or an
        explicitly reported tier other than Standard. The tool does not assign
        Standard cost to a completion served on a different tier.

        After transport and schema validation, semantic errors are checked in
        this order: `duplicate_brand_key` (exact duplicate key),
        `invalid_primary` (primary is not in the effective list),
        `unsupported_analyzer` (ID is not advertised by `listAnalyzers`),
        and `unsupported_language`
        (policy is `error` and an analyzer does not support the given or detected
        language). The 422 detail identifies the first offending field in
        request order and names supported languages for language errors.
      tags: [Analysis]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnswerAnalysisRequest'
      responses:
        '200':
          description: One entry per mentioned brand (unmentioned brands are omitted).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnswerAnalysis'
        '400':
          $ref: '../common.yaml#/components/responses/BadRequest'
        '422':
          $ref: '../common.yaml#/components/responses/UnprocessableContent'
        '503':
          $ref: '../common.yaml#/components/responses/ServiceUnavailable'
        default:
          $ref: '../common.yaml#/components/responses/InternalError'
components:
  schemas:
    AnalyzerId:
      type: string
      description: |
        `det:<method>` for deterministic analyzers (for example `det:lexicon`,
        `det:rules`) or `llm:<provider>/<model>` for LLM analyzers (for example
        `llm:openai/gpt-4o-mini`). The available set comes from `listAnalyzers`.
      pattern: '^(det:[a-z][a-z0-9_]*|llm:[a-z][a-z0-9_-]*/[A-Za-z0-9._:-]+)$'
      maxLength: 120
    AnalyzerKind:
      type: string
      enum: [deterministic, llm]
    Analyzer:
      type: object
      required: [id, kind, languages, description]
      properties:
        id:
          $ref: '#/components/schemas/AnalyzerId'
        kind:
          $ref: '#/components/schemas/AnalyzerKind'
        languages:
          type: array
          description: Primary language subtags supported, e.g. `en`; `*` means any language (LLM analyzers). For deterministic analyzers this is the set of languages in the lexicon registry.
          items:
            type: string
            pattern: '^(\*|[a-z]{2,3})$'
        description:
          type: string
    SentimentOptions:
      type: object
      unevaluatedProperties: false
      properties:
        analyzers:
          type: array
          description: 'Analyzers to run side by side. Empty disables sentiment. Default: `[det:lexicon]`.'
          maxItems: 5
          uniqueItems: true
          default: ['det:lexicon']
          items:
            $ref: '#/components/schemas/AnalyzerId'
        primary:
          description: 'Analyzer whose result fills `sentiment` and `sentimentScore`; must be in `analyzers` (otherwise 422 `invalid_primary`). Default: the first deterministic analyzer that supports the language, else the first analyzer that does.'
          $ref: '#/components/schemas/AnalyzerId'
        language:
          description: 'Language of the text. Default: detected deterministically from the text.'
          $ref: '../common.yaml#/components/schemas/LanguageTag'
        onUnsupportedLanguage:
          type: string
          description: |
            What happens when a requested analyzer does not support the language.
            `fallback` (default): that analyzer reports `unsupported`; if it was the
            primary, the first requested analyzer that supports the language becomes
            primary (`primaryFallback: true`); if none does, sentiment is null and
            mentions are still returned. `error`: the call answers 422
            `unsupported_language`. Callers set it from their configuration (for
            example per prompt run).
          enum: [fallback, error]
          default: fallback
    AnswerAnalysisOptions:
      type: object
      description: Everything except the text, for callers that know the options before the text exists (they add the text later).
      required: [brands]
      properties:
        brands:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: '../common.yaml#/components/schemas/TrackedBrand'
        sentiment:
          $ref: '#/components/schemas/SentimentOptions'
    AnswerAnalysisRequest:
      type: object
      properties:
        sentiment:
          default: {}
          allOf:
            - $ref: '#/components/schemas/SentimentOptions'
      allOf:
        - type: object
          required: [brands]
          properties:
            brands:
              $ref: '#/components/schemas/AnswerAnalysisOptions/properties/brands'
        - type: object
          required: [text]
          properties:
            text:
              type: string
              maxLength: 200000
      unevaluatedProperties: false
    AnalyzerStatus:
      type: string
      description: '`ok`; `unsupported` (the analyzer does not support the language); `failed` (provider error, unusable completion, or invalid usage, LLM only).'
      enum: [ok, unsupported, failed]
    AnalyzerSentiment:
      type: object
      description: One analyzer's verdict for one mention.
      required: [analyzer, status, label, score]
      properties:
        analyzer:
          $ref: '#/components/schemas/AnalyzerId'
        status:
          $ref: '#/components/schemas/AnalyzerStatus'
        label:
          description: Null unless `status` is `ok`.
          oneOf:
            - $ref: '../common.yaml#/components/schemas/Sentiment'
            - type: 'null'
        score:
          type: [number, 'null']
          minimum: -1
          maximum: 1
        rationale:
          type: [string, 'null']
          maxLength: 300
          description: Short reason given by an LLM analyzer, or the matched cue words of a deterministic one.
    SentimentAgreement:
      type: object
      description: How the `ok` analyzers compare on one mention. Present when two or more analyzers returned `ok`.
      required: [analyzerCount, majorityLabel, agreeingCount, unanimous, scoreSpread]
      properties:
        analyzerCount:
          type: integer
          minimum: 2
        majorityLabel:
          description: Most frequent label; null on a tie.
          oneOf:
            - $ref: '../common.yaml#/components/schemas/Sentiment'
            - type: 'null'
        agreeingCount:
          type: integer
          minimum: 1
          description: Analyzers whose label equals the most frequent label.
        unanimous:
          type: boolean
        scoreSpread:
          type: number
          minimum: 0
          maximum: 2
          description: Max score minus min score.
    MentionDetail:
      type: object
      description: What was found for one brand in one answer. The orchestrator's Mention resource reuses it.
      required: [position, occurrences, sentiment, sentimentScore, sentimentByAnalyzer, agreement, snippet]
      properties:
        position:
          type: integer
          minimum: 1
          description: 1-based rank of this brand's first mention among the given brands in the answer.
        occurrences:
          type: integer
          minimum: 1
        sentiment:
          description: Label from the primary analyzer; null when sentiment was disabled or no requested analyzer supports the language.
          oneOf:
            - $ref: '../common.yaml#/components/schemas/Sentiment'
            - type: 'null'
        sentimentScore:
          type: [number, 'null']
          minimum: -1
          maximum: 1
          description: Score from the primary analyzer (-1 to 1).
        sentimentByAnalyzer:
          type: array
          description: One entry per requested analyzer, in request order.
          items:
            $ref: '#/components/schemas/AnalyzerSentiment'
        agreement:
          oneOf:
            - $ref: '#/components/schemas/SentimentAgreement'
            - type: 'null'
        snippet:
          type: string
          maxLength: 500
          description: Text around the first mention.
    AnalyzerRun:
      type: object
      description: Per-analyzer outcome for the whole answer.
      required: [analyzer, kind, status, primary]
      properties:
        analyzer:
          $ref: '#/components/schemas/AnalyzerId'
        kind:
          $ref: '#/components/schemas/AnalyzerKind'
        status:
          $ref: '#/components/schemas/AnalyzerStatus'
        primary:
          type: boolean
    AnswerAnalysis:
      type: object
      required: [language, languageSource, primaryFallback, analyzers, mentions, usage]
      properties:
        language:
          description: Language used for sentiment (given or detected); null if undetermined.
          oneOf:
            - $ref: '../common.yaml#/components/schemas/LanguageTag'
            - type: 'null'
        languageSource:
          type: string
          enum: [given, detected, undetermined]
        primaryFallback:
          type: boolean
          description: 'True when the requested or default primary did not support the language and another analyzer was used (`onUnsupportedLanguage: fallback`).'
        analyzers:
          type: array
          items:
            $ref: '#/components/schemas/AnalyzerRun'
        mentions:
          type: array
          items:
            allOf:
              - type: object
                required: [brandKey]
                properties:
                  brandKey:
                    type: string
                    description: '`key` of the matching TrackedBrand.'
              - $ref: '#/components/schemas/MentionDetail'
        usage:
          $ref: '../common.yaml#/components/schemas/LlmUsageList'
