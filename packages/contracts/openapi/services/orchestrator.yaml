# REx orchestrator: the only stateful service and the only public business API.
# Source of truth for its REST contract (packages/contracts, ADR 0006). Shared parts come from common.yaml via $ref.
openapi: 3.1.0
info:
  title: REx orchestrator
  version: 2.0.0
  description: |
    The only stateful REx service: sole owner and writer of the database, the only
    public business API (behind the edge gateway), the scheduler, the job publisher
    (transactional outbox to RabbitMQ) and the consumer of job results. Internally a
    modular monolith: identity, catalog, tracking, optimization, scheduling, billing,
    alerts and messaging modules (docs/services/orchestrator.md).

    Resources that embed tool output `$ref` the tool's schema (EngineAnswer,
    MentionDetail, CitationDetail, AuditResult, LlmsTxtResult) instead of copying it.
    Paths under `/v1/tools` are reserved for the gateway's public tool routes.
x-rex-service:
  name: orchestrator
  kind: orchestrator
security:
  - bearerToken: []
  - apiKey: []
tags:
  - name: Auth
  - name: Orgs
  - name: API keys
  - name: Projects
  - name: Brands
  - name: Prompts
  - name: Prompt runs
  - name: Answers
  - name: Visibility
  - name: Citations
  - name: Schedules
  - name: Audits
  - name: llms.txt
  - name: Internal
  - name: Health
paths:
  /healthz:
    $ref: ../common.yaml#/components/pathItems/Healthz
  /readyz:
    $ref: ../common.yaml#/components/pathItems/Readyz
  /v1/auth/signup:
    post:
      operationId: signup
      summary: Create a user and their first org
      tags:
        - Auth
      security: []
      parameters:
        - $ref: ../common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
      responses:
        '201':
          description: Signed up; tokens are scoped to the new org.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tokens'
        '400':
          $ref: ../common.yaml#/components/responses/BadRequest
        '409':
          $ref: ../common.yaml#/components/responses/Conflict
        '429':
          $ref: ../common.yaml#/components/responses/TooManyRequests
        default:
          $ref: ../common.yaml#/components/responses/InternalError
  /v1/auth/login:
    post:
      operationId: login
      summary: Log in with email and password
      tags:
        - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Tokens scoped to the user's default org.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tokens'
        '400':
          $ref: ../common.yaml#/components/responses/BadRequest
        '401':
          $ref: ../common.yaml#/components/responses/Unauthorized
        '429':
          $ref: ../common.yaml#/components/responses/TooManyRequests
        default:
          $ref: ../common.yaml#/components/responses/InternalError
  /v1/auth/refresh:
    post:
      operationId: refreshTokens
      summary: Rotate the refresh token, optionally switching the active org
      tags:
        - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: New token pair. The old refresh token is revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tokens'
        '400':
          $ref: ../common.yaml#/components/responses/BadRequest
        '401':
          $ref: ../common.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../common.yaml#/components/responses/Forbidden
        '429':
          $ref: ../common.yaml#/components/responses/TooManyRequests
        default:
          $ref: ../common.yaml#/components/responses/InternalError
  /v1/auth/logout:
    post:
      operationId: logout
      summary: Revoke the given refresh token
      tags:
        - Auth
      security:
        - bearerToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '204':
          $ref: ../common.yaml#/components/responses/NoContent
        '401':
          $ref: ../common.yaml#/components/responses/Unauthorized
        '429':
          $ref: ../common.yaml#/components/responses/TooManyRequests
        default:
          $ref: ../common.yaml#/components/responses/InternalError
  /v1/me:
    get:
      operationId: getMe
      summary: Current user, active org and role
      tags:
        - Auth
      security:
        - bearerToken: []
      responses:
        '200':
          description: The caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: ../common.yaml#/components/responses/Unauthorized
        '429':
          $ref: ../common.yaml#/components/responses/TooManyRequests
        default:
          $ref: ../common.yaml#/components/responses/InternalError
  /v1/orgs:
    get:
      operationId: listOrgs
      summary: Orgs the user belongs to
      tags:
        - Orgs
      security:
        - bearerToken: []
      parameters:
        - $ref: ../common.yaml#/components/parameters/Cursor
        - $ref: ../common.yaml#/components/parameters/Limit
      responses:
        '200':
          description: A page of orgs.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: ../common.yaml#/components/schemas/Page
                  - type: object
                    properties:
                      data:
                        items:
                          $ref: '#/components/schemas/Org'
        '401':
          $ref: ../common.yaml#/components/responses/Unauthorized
        '429':
          $ref: ../common.yaml#/components/responses/TooManyRequests
        default:
          $ref: ../common.yaml#/components/responses/InternalError
  /v1/orgs/{orgId}:
    parameters:
      - name: orgId
        in: path
        required: true
        schema:
          $ref: ../common.yaml#/components/schemas/OrgId
    get:
      operationId: getOrg
      summary: Get an org
      tags:
        - Orgs
      responses:
        '200':
          description: The org.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Org'
        '401':
          $ref: ../common.yaml#/components/responses/Unauthorized
        '404':
          $ref: ../common.yaml#/components/responses/NotFound
        '429':
          $ref: ../common.yaml#/components/responses/TooManyRequests
        default:
          $ref: ../common.yaml#/components/responses/InternalError
    patch:
      operationId: updateOrg
      summary: Update an org (owner or admin)
      tags:
        - Orgs
      security:
        - bearerToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrgUpdate'
      responses:
        '200':
          description: The updated org.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Org'
        '400':
          $ref: ../common.yaml#/components/responses/BadRequest
        '401':
          $ref: ../common.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../common.yaml#/components/responses/Forbidden
        '404':
          $ref: ../common.yaml#/components/responses/NotFound
        '429':
          $ref: ../common.yaml#/components/responses/TooManyRequests
        default:
          $ref: ../common.yaml#/components/responses/InternalError
    delete:
      operationId: deleteOrg
      summary: Delete an org and all its data (owner only)
      tags:
        - Orgs
      security:
        - bearerToken: []
      responses:
        '204':
          $ref: ../common.yaml#/components/responses/NoContent
        '401':
          $ref: ../common.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../common.yaml#/components/responses/Forbidden
        '404':
          $ref: ../common.yaml#/components/responses/NotFound
        '429':
          $ref: ../common.yaml#/components/responses/TooManyRequests
        default:
          $ref: ../common.yaml#/components/responses/InternalError
  /v1/orgs/{orgId}/members:
    parameters:
      - name: orgId
        in: path
        required: true
        schema:
          $ref: ../common.yaml#/components/schemas/OrgId
    get:
      operationId: listOrgMembers
      summary: Members of an org
      tags:
        - Orgs
      parameters:
        - $ref: ../common.yaml#/components/parameters/Cursor
        - $ref: ../common.yaml#/components/parameters/Limit
      responses:
        '200':
          description: A page of members.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: ../common.yaml#/components/schemas/Page
                  - type: object
                    properties:
                      data:
                        items:
                          $ref: '#/components/schemas/Member'
        '401':
          $ref: ../common.yaml#/components/responses/Unauthorized
        '404':
          $ref: ../common.yaml#/components/responses/NotFound
        '429':
          $ref: ../common.yaml#/components/responses/TooManyRequests
        default:
          $ref: ../common.yaml#/components/responses/InternalError
  /v1/api-keys:
    get:
      operationId: listApiKeys
      summary: API keys of the caller's org (secrets are never returned)
      tags:
        - API keys
      security:
        - bearerToken: []
      parameters:
        - $ref: ../common.yaml#/components/parameters/Cursor
        - $ref: ../common.yaml#/components/parameters/Limit
      responses:
        '200':
          description: A page of API keys.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: ../common.yaml#/components/schemas/Page
                  - type: object
                    properties:
                      data:
                        items:
                          $ref: '#/components/schemas/ApiKey'
        '401':
          $ref: ../common.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../common.yaml#/components/responses/Forbidden
        '429':
          $ref: ../common.yaml#/components/responses/TooManyRequests
        default:
          $ref: ../common.yaml#/components/responses/InternalError
    post:
      operationId: createApiKey
      summary: Create an API key (the secret is returned once)
      tags:
        - API keys
      security:
        - bearerToken: []
      parameters:
        - $ref: ../common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiKeyCreate'
      responses:
        '201':
          description: Created. Store `secret` now; it cannot be retrieved again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyWithSecret'
        '400':
          $ref: ../common.yaml#/components/responses/BadRequest
        '401':
          $ref: ../common.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../common.yaml#/components/responses/Forbidden
        '429':
          $ref: ../common.yaml#/components/responses/TooManyRequests
        default:
          $ref: ../common.yaml#/components/responses/InternalError
  /v1/api-keys/{apiKeyId}:
    parameters:
      - name: apiKeyId
        in: path
        required: true
        schema:
          $ref: ../common.yaml#/components/schemas/ApiKeyId
    delete:
      operationId: revokeApiKey
      summary: Revoke an API key (effective immediately at the orchestrator)
      tags:
        - API keys
      security:
        - bearerToken: []
      responses:
        '204':
          $ref: ../common.yaml#/components/responses/NoContent
        '401':
          $ref: ../common.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../common.yaml#/components/responses/Forbidden
        '404':
          $ref: ../common.yaml#/components/responses/NotFound
        '429':
          $ref: ../common.yaml#/components/responses/TooManyRequests
        default:
          $ref: ../common.yaml#/components/responses/InternalError
  /v1/projects:
    get:
      operationId: listProjects
      summary: Projects in the caller's org
      tags:
        - Projects
      parameters:
        - $ref: ../common.yaml#/components/parameters/Cursor
        - $ref: ../common.yaml#/components/parameters/Limit
      responses:
        '200':
          description: A page of projects.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: ../common.yaml#/components/schemas/Page
                  - type: object
                    properties:
                      data:
                        items:
                          $ref: '#/components/schemas/Project'
        '401':
          $ref: ../common.yaml#/components/responses/Unauthorized
        '429':
          $ref: ../common.yaml#/components/responses/TooManyRequests
        default:
          $ref: ../common.yaml#/components/responses/InternalError
    post:
      operationId: createProject
      summary: Create a project
      tags:
        - Projects
      parameters:
        - $ref: ../common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreate'
      responses:
        '201':
          description: Created.
          headers:
            Location:
              $ref: ../common.yaml#/components/headers/Location
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: ../common.yaml#/components/responses/BadRequest
        '401':
          $ref: ../common.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../common.yaml#/components/responses/Forbidden
        '422':
          $ref: ../common.yaml#/components/responses/UnprocessableContent
        '429':
          $ref: ../common.yaml#/components/responses/TooManyRequests
        default:
          $ref: ../common.yaml#/components/responses/InternalError
  /v1/projects/{projectId}:
    parameters:
      - name: projectId
        in: path
        required: true
        schema:
          $ref: ../common.yaml#/components/schemas/ProjectId
    get:
      operationId: getProject
      summary: Get a project
      tags:
        - Projects
      responses:
        '200':
          description: The project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '401':
          $ref: ../common.yaml#/components/responses/Unauthorized
        '404':
          $ref: ../common.yaml#/components/responses/NotFound
        '429':
          $ref: ../common.yaml#/components/responses/TooManyRequests
        default:
          $ref: ../common.yaml#/components/responses/InternalError
    patch:
      operationId: updateProject
      summary: Update a project (merge-patch semantics)
      tags:
        - Projects
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectUpdate'
      responses:
        '200':
          description: The updated project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: ../common.yaml#/components/responses/BadRequest
        '401':
          $ref: ../common.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../common.yaml#/components/responses/Forbidden
        '404':
          $ref: ../common.yaml#/components/responses/NotFound
        '429':
          $ref: ../common.yaml#/components/responses/TooManyRequests
        default:
          $ref: ../common.yaml#/components/responses/InternalError
    delete:
      operationId: deleteProject
      summary: Delete a project and all its data
      tags:
        - Projects
      responses:
        '204':
          $ref: ../common.yaml#/components/responses/NoContent
        '401':
          $ref: ../common.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../common.yaml#/components/responses/Forbidden
        '404':
          $ref: ../common.yaml#/components/responses/NotFound
        '429':
          $ref: ../common.yaml#/components/responses/TooManyRequests
        default:
          $ref: ../common.yaml#/components/responses/InternalError
  /v1/brands:
    get:
      operationId: listBrands
      summary: Brands in a project (primary first, then competitors)
      tags:
        - Brands
      parameters:
        - $ref: ../common.yaml#/components/parameters/ProjectIdQuery
        - name: kind
          in: query
          required: false
          schema:
            $ref: ../common.yaml#/components/schemas/BrandKind
        - $ref: ../common.yaml#/components/parameters/Cursor
        - $ref: ../common.yaml#/components/parameters/Limit
      responses:
        '200':
          description: A page of brands.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: ../common.yaml#/components/schemas/Page
                  - type: object
                    properties:
                      data:
                        items:
                          $ref: '#/components/schemas/Brand'
        '400':
          $ref: ../common.yaml#/components/responses/BadRequest
        '401':
          $ref: ../common.yaml#/components/responses/Unauthorized
        '429':
          $ref: ../common.yaml#/components/responses/TooManyRequests
        default:
          $ref: ../common.yaml#/components/responses/InternalError
    post:
      operationId: createBrand
      summary: Add the primary brand or a competitor to a project
      tags:
        - Brands
      parameters:
        - $ref: ../common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BrandCreate'
      responses:
        '201':
          description: Created.
          headers:
            Location:
              $ref: ../common.yaml#/components/headers/Location
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Brand'
        '400':
          $ref: ../common.yaml#/components/responses/BadRequest
        '401':
          $ref: ../common.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../common.yaml#/components/responses/Forbidden
        '409':
          $ref: ../common.yaml#/components/responses/Conflict
        '422':
          $ref: ../common.yaml#/components/responses/UnprocessableContent
        '429':
          $ref: ../common.yaml#/components/responses/TooManyRequests
        default:
          $ref: ../common.yaml#/components/responses/InternalError
  /v1/brands/{brandId}:
    parameters:
      - name: brandId
        in: path
        required: true
        schema:
          $ref: ../common.yaml#/components/schemas/BrandId
    get:
      operationId: getBrand
      summary: Get a brand
      tags:
        - Brands
      responses:
        '200':
          description: The brand.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Brand'
        '401':
          $ref: ../common.yaml#/components/responses/Unauthorized
        '404':
          $ref: ../common.yaml#/components/responses/NotFound
        '429':
          $ref: ../common.yaml#/components/responses/TooManyRequests
        default:
          $ref: ../common.yaml#/components/responses/InternalError
    patch:
      operationId: updateBrand
      summary: Update a brand (merge-patch semantics)
      tags:
        - Brands
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BrandUpdate'
      responses:
        '200':
          description: The updated brand.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Brand'
        '400':
          $ref: ../common.yaml#/components/responses/BadRequest
        '401':
          $ref: ../common.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../common.yaml#/components/responses/Forbidden
        '404':
          $ref: ../common.yaml#/components/responses/NotFound
        '422':
          $ref: ../common.yaml#/components/responses/UnprocessableContent
        '429':
          $ref: ../common.yaml#/components/responses/TooManyRequests
        default:
          $ref: ../common.yaml#/components/responses/InternalError
    delete:
      operationId: deleteBrand
      summary: Delete a competitor brand (the primary brand cannot be deleted)
      tags:
        - Brands
      responses:
        '204':
          $ref: ../common.yaml#/components/responses/NoContent
        '401':
          $ref: ../common.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../common.yaml#/components/responses/Forbidden
        '404':
          $ref: ../common.yaml#/components/responses/NotFound
        '422':
          $ref: ../common.yaml#/components/responses/UnprocessableContent
        '429':
          $ref: ../common.yaml#/components/responses/TooManyRequests
        default:
          $ref: ../common.yaml#/components/responses/InternalError
  /v1/prompts:
    get:
      operationId: listPrompts
      summary: Tracked prompts of a project
      tags:
        - Prompts
      parameters:
        - $ref: ../common.yaml#/components/parameters/ProjectIdQuery
        - name: active
          in: query
          required: false
          schema:
            type: boolean
        - name: tag
          in: query
          required: false
          schema:
            type: string
        - $ref: ../common.yaml#/components/parameters/Cursor
        - $ref: ../common.yaml#/components/parameters/Limit
      responses:
        '200':
          description: A page of prompts.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: ../common.yaml#/components/schemas/Page
                  - type: object
                    properties:
                      data:
                        items:
                          $ref: '#/components/schemas/Prompt'
        '400':
          $ref: ../common.yaml#/components/responses/BadRequest
        '401':
          $ref: ../common.yaml#/components/responses/Unauthorized
        '429':
          $ref: ../common.yaml#/components/responses/TooManyRequests
        default:
          $ref: ../common.yaml#/components/responses/InternalError
    post:
      operationId: createPrompt
      summary: Track a new prompt
      tags:
        - Prompts
      parameters:
        - $ref: ../common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PromptCreate'
      responses:
        '201':
          description: Created.
          headers:
            Location:
              $ref: ../common.yaml#/components/headers/Location
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Prompt'
        '400':
          $ref: ../common.yaml#/components/responses/BadRequest
        '401':
          $ref: ../common.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../common.yaml#/components/responses/Forbidden
        '409':
          $ref: ../common.yaml#/components/responses/Conflict
        '422':
          $ref: ../common.yaml#/components/responses/UnprocessableContent
        '429':
          $ref: ../common.yaml#/components/responses/TooManyRequests
        default:
          $ref: ../common.yaml#/components/responses/InternalError
  /v1/prompts/{promptId}:
    parameters:
      - name: promptId
        in: path
        required: true
        schema:
          $ref: ../common.yaml#/components/schemas/PromptId
    get:
      operationId: getPrompt
      summary: Get a prompt
      tags:
        - Prompts
      responses:
        '200':
          description: The prompt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Prompt'
        '401':
          $ref: ../common.yaml#/components/responses/Unauthorized
        '404':
          $ref: ../common.yaml#/components/responses/NotFound
        '429':
          $ref: ../common.yaml#/components/responses/TooManyRequests
        default:
          $ref: ../common.yaml#/components/responses/InternalError
    patch:
      operationId: updatePrompt
      summary: Update a prompt (merge-patch semantics; past answers keep their text snapshot)
      tags:
        - Prompts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PromptUpdate'
      responses:
        '200':
          description: The updated prompt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Prompt'
        '400':
          $ref: ../common.yaml#/components/responses/BadRequest
        '401':
          $ref: ../common.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../common.yaml#/components/responses/Forbidden
        '404':
          $ref: ../common.yaml#/components/responses/NotFound
        '422':
          $ref: ../common.yaml#/components/responses/UnprocessableContent
        '429':
          $ref: ../common.yaml#/components/responses/TooManyRequests
        default:
          $ref: ../common.yaml#/components/responses/InternalError
    delete:
      operationId: deletePrompt
      summary: Stop tracking a prompt (its past answers are kept)
      tags:
        - Prompts
      responses:
        '204':
